<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="研究">
    <title>研究 | tomo Portfolio</title>
    <link rel="stylesheet" href="../style.css?v=20260912-home-categories">
    <link rel="stylesheet" href="research.css?v=20260929-history">
    <script src="history-data.js?v=20260929-history" defer></script>
    <script src="research.js?v=20260929-history" defer></script>
</head>
<body class="subpage subpage--research">
    <header class="subpage__header">
        <a class="site-name" href="../">TOMO PORTFOLIO</a>
        <a class="back-link" href="../">← トップへ戻る</a>
    </header>
    <main class="subpage__main">
        <p class="subpage__number" aria-hidden="true">03</p>
        <div class="research-content">
            <h1>研究</h1>
        </div>
        <section class="research-entry" aria-labelledby="undergraduate-research-title">
            <p class="research-level">学部</p>

            <!-- 研究タイトルは、次のh2内の文字列を変更してください。 -->
            <h2 class="research-title" id="undergraduate-research-title">GSDeformerの高速化について</h2>

            <div class="research-progress-heading">
                <label for="undergraduate-progress">進捗</label>
                <output id="undergraduate-progress-value" for="undergraduate-progress">0%</output>
            </div>
            <!-- 進捗は、次のvalueを0〜100の数値で指定してください。 -->
            <progress id="undergraduate-progress" value="0" max="100" aria-describedby="undergraduate-progress-value">0%</progress>

            <section class="research-history" aria-labelledby="research-history-title">
                <div class="research-history-heading">
                    <h3 id="research-history-title">更新履歴</h3>
                    <p id="research-history-status" aria-live="polite">履歴を読み込んでいます…</p>
                </div>
                <div class="research-history-scroll" id="research-history-scroll" tabindex="0" aria-label="研究の更新履歴。上下にスクロールできます">
                    <ol class="research-history-list" id="research-history-list"></ol>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
