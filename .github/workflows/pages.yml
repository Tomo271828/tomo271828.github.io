name: Update rating and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Sunday 01:00 JST = Saturday 16:00 UTC
    - cron: '0 16 * * 6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch rating history
        run: python scripts/update-atcoder.py
      - name: Save updated rating
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitive-programming/atcoder-rating.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AtCoder rating history"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
