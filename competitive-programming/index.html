<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="tomoの競技プログラミング活動を紹介します。">
    <title>競技プログラミング | tomo Portfolio</title>
    <link rel="stylesheet" href="../style.css?v=20260907-2">
    <link rel="stylesheet" href="rating.css?v=20260912-mobile-chart">
    <script src="rating.js?v=20260912-mobile-chart" defer></script>
</head>
<body class="subpage subpage--competitive">
    <header class="subpage__header">
        <a class="site-name" href="../">TOMO PORTFOLIO</a>
        <a class="back-link" href="../">← トップへ戻る</a>
    </header>
    <main class="competitive-main">
        <div class="competitive-intro">
            <h1>競技プログラミング</h1>
        </div>
        <section class="rating-panel" aria-labelledby="rating-title">
            <div class="rating-header">
                <h2 id="rating-title">AtCoder</h2>
                <a id="atcoder-profile" target="_blank" rel="noopener noreferrer">AtCoder ユーザーページ</a>
            </div>
            <div class="rating-tabs" role="tablist" aria-label="Ratingの種類">
                <button type="button" id="rating-tab-algo" role="tab" data-rating-mode="algo" aria-selected="true" aria-controls="rating-content">Algorithm</button>
                <button type="button" id="rating-tab-heuristic" role="tab" data-rating-mode="heuristic" aria-selected="false" aria-controls="rating-content" tabindex="-1">Heuristic</button>
            </div>
            <div id="rating-content" role="tabpanel" aria-labelledby="rating-tab-algo">
            <dl class="rating-stats">
                <div><dt>現在のRating</dt><dd id="rating-current">—</dd></div>
                <div><dt>最高Rating</dt><dd id="rating-highest">—</dd></div>
                <div><dt>Rated参加回数</dt><dd id="rating-count">—</dd></div>
                <div><dt>上位%</dt><dd id="rating-top-percent">—</dd></div>
                <div><dt>総AC数 <small>（AtCoder Problems）</small></dt><dd id="rating-ac-count">—</dd></div>
            </dl>
            <div class="rating-chart" id="rating-chart"></div>
            <p class="rating-caption" id="rating-caption" aria-live="polite">Rating履歴を読み込んでいます…</p>
            <p class="rating-updated" id="rating-updated"></p>
            </div>
            <noscript>Ratingグラフを見るにはJavaScriptを有効にしてください。</noscript>
        </section>
        <section class="rating-panel library-panel" aria-labelledby="library-title">
            <div class="rating-header">
                <h2 id="library-title">TomoLibrary</h2>
            </div>
            <p class="library-description">C#で記述された、競プロ用自作ライブラリ</p>
            <h3 class="library-checker-title">Library Checker</h3>
            <dl class="rating-stats library-stats">
                <div><dt>総AC数</dt><dd id="library-ac-count">—</dd></div>
            </dl>
            <p class="rating-updated" id="library-updated" aria-live="polite">AC数を読み込んでいます…</p>
            <noscript>AC数を見るにはJavaScriptを有効にしてください。</noscript>
        </section>
    </main>
</body>
</html>
